name: Space Satellites observer checks

on:
  pull_request:
    paths:
      - "observers/space-satellites/**"
      - "scripts/heartbeat_and_publish_website.sh"
      - "tests/test_space_satellites*.py"
      - ".github/workflows/space-satellites-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Check collector syntax
        run: python -m py_compile observers/space-satellites/observer.py
      - name: Check publisher shell syntax
        run: bash -n scripts/heartbeat_and_publish_website.sh
      - name: Run focused Space Satellites tests
        run: python -m pytest -q tests/test_space_satellites.py tests/test_space_satellites_publisher.py
